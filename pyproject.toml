[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proton-ai"
version = "0.2.0"
description = "Experimental from-scratch neural model with separate teacher agents"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
guardian = ["transformers>=4.51.0", "accelerate>=0.30.0", "safetensors>=0.4.3"]
voice = ["cryptography>=42"]

[project.scripts]
proton = "proton.cli:main"
proton-chat = "proton.cli:main"
proton-train = "proton.train:main"
proton-collective = "proton.collective_cli:main"\nproton-research = "proton.research:main"

[tool.setuptools.packages.find]
include = ["proton*"]
