<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<title>Proton-AI · Conversa</title>
<style>
:root{color-scheme:dark;--bg:#070b18;--panel:#0d1428;--line:#20345b;--cyan:#35e7ff;--blue:#5878ff;--text:#edf5ff;--muted:#91a4c5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 0%,#132958 0,transparent 42%),radial-gradient(ellipse at 100% 80%,#17123d 0,transparent 38%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
button,textarea{font:inherit}.wrap{max-width:850px;margin:auto;padding:18px;min-height:100vh;display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:12px;padding:10px 0 18px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--cyan),var(--blue));display:grid;place-items:center;color:#06101f;font-weight:1000;font-size:22px;box-shadow:0 0 28px #35e7ff44}.brand{font-weight:850;font-size:20px;letter-spacing:.04em}.glow{color:var(--cyan)}.sub{color:var(--muted);font-size:12px}.chat{flex:1;min-height:55vh;background:#0b1224d9;border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 18px 60px #0005}.messages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;min-height:300px}.msg{max-width:88%;padding:12px 14px;border-radius:15px;white-space:pre-wrap;overflow-wrap:anywhere}.bot{align-self:flex-start;background:#141f39;border:1px solid #263d65}.user{align-self:flex-end;background:#183e62;border:1px solid #28658b}.composer{display:flex;gap:9px;align-items:end}.composer textarea{flex:1;min-height:50px;max-height:150px;resize:vertical;background:#080f20;border:1px solid #2b416b;border-radius:13px;color:white;padding:13px}.btn{min-height:50px;padding:0 18px;border:0;border-radius:13px;background:linear-gradient(100deg,#1abedb,#526eff);color:#04111f;font-weight:800}.btn:disabled{opacity:.5}.hint{color:var(--muted);font-size:12px;text-align:center;margin:10px 0}.status{color:var(--muted);font-size:12px;text-align:center;padding:8px}.status.ready{color:#5cf0b0}
@media(max-width:560px){.wrap{padding:12px}.chat{padding:11px}.composer{gap:7px}.btn{padding:0 13px}.msg{max-width:94%}}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><div class="logo">P</div><div><div class="brand">PROTON<span class="glow">-AI</span></div><div class="sub">Assistente conversacional experimental</div></div></header>
<section class="chat">
<div class="messages" id="messages" aria-live="polite"><div class="msg bot">Oi! Eu sou o Proton. 😄 Sobre o que você quer conversar?</div></div>
<form class="composer" id="chatForm"><textarea id="message" aria-label="Mensagem para Proton" placeholder="Converse com o Proton..." maxlength="4000" required></textarea><button class="btn" id="send" type="submit">Enviar</button></form>
<div class="status" id="engineStatus">Conectando...</div>
</section>
<p class="hint">O histórico desta conversa fica nesta sessão. Evite enviar senhas ou informações pessoais.</p>
</main>
<script>
const $=id=>document.getElementById(id);
let sessionId=sessionStorage.getItem("proton_chat_session");
if(!sessionId){sessionId=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());sessionStorage.setItem("proton_chat_session",sessionId)}
function addMessage(text,role){const node=document.createElement("div");node.className="msg "+role;node.textContent=text;$("messages").append(node);$("messages").scrollTop=$("messages").scrollHeight}
$("chatForm").addEventListener("submit",async event=>{event.preventDefault();const message=$("message").value.trim();if(!message)return;addMessage(message,"user");$("message").value="";$("send").disabled=true;$("engineStatus").textContent="Proton está pensando...";try{const response=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,session_id:sessionId})});const data=await response.json();if(!response.ok)throw new Error(data.detail||"Não consegui responder agora.");addMessage(data.reply||"Não recebi uma resposta.", "bot");$("engineStatus").textContent=data.engine==="generative"?"Modelo generativo conectado":"Modo básico: falta configurar o modelo generativo";$("engineStatus").className="status "+(data.engine==="generative"?"ready":"")}catch(error){addMessage("Ops, tive um problema de conexão: "+error.message,"bot");$("engineStatus").textContent="Falha de conexão"}finally{$("send").disabled=false;$("message").focus()}});
$("message").addEventListener("keydown",event=>{if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();$("chatForm").requestSubmit()}});
</script>
</body>
</html>
