name: Proton bounded neural training

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/starter.txt"
      - "collective/approved.jsonl"
      - "proton/collective.py"
      - "proton/collective_cli.py"
      - "proton/model.py"
      - "proton/train.py"
      - ".github/workflows/train-proton.yml"

permissions:
  contents: read

concurrency:
  group: proton-neural-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install NumPy
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy

      - name: Install CPU training dependency
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Export approved collective lessons
        run: |
          python -m proton.collective_cli export-training --output /tmp/collective-training.txt
          cat data/starter.txt /tmp/collective-training.txt > /tmp/proton-training.txt

      - name: Train experimental Proton model
        run: |
          python -m proton.train \
            --data /tmp/proton-training.txt \
            --hours 3 \
            --max-steps 1000000 \
            --device cpu \
            --eval-interval 1000

      - name: Save model checkpoint as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: proton-checkpoint-${{ github.run_id }}
          path: checkpoints/proton-latest.pt
          if-no-files-found: error
          retention-days: 30

      - name: Explain training result
        run: |
          echo "## Proton training finished" >> "$GITHUB_STEP_SUMMARY"
          echo "- Requested training duration: up to 3 hours, with a 220-minute job safety timeout." >> "$GITHUB_STEP_SUMMARY"
          echo "- Only explicitly approved collective lessons marked training_eligible are included." >> "$GITHUB_STEP_SUMMARY"
          echo "- The checkpoint is attached as a workflow artifact for 30 days." >> "$GITHUB_STEP_SUMMARY"
          echo "- This experimental character-level model is not yet a capable conversational or coding AI." >> "$GITHUB_STEP_SUMMARY"
          echo "- The current corpus is small; a long run may overfit and is an engineering experiment, not a capability guarantee." >> "$GITHUB_STEP_SUMMARY"
