name: Proton neural core checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  neural-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyTorch
        run: python -m pip install --upgrade pip torch
      - name: Run neural core tests
        run: python -m unittest tests.test_neural -v
